<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        /* --- ESTILO PERSONALIZADO ESPAÇO DE COMPRAS --- */
        body, html { margin: 0; padding: 0; background: #ffffff; font-family: 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
        
        .mural-titulo { 
            padding: 20px 18px 10px 18px; 
            font-size: 22px; 
            font-weight: 900; 
            color: #673ab7; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .mural-titulo::before { 
            content: ''; 
            width: 5px; 
            height: 22px; 
            background: #9c27b0; 
            border-radius: 2px; 
        }

        .barra-divisora { width: 100%; height: 8px; background: linear-gradient(90deg, #673ab7, #9c27b0); margin-bottom: 10px; }

        .swiper { width: 100%; padding-bottom: 30px; background: #fff; }
        .swiper-slide { 
            width: 85%; 
            max-width: 400px; 
            display: flex; 
            flex-direction: column; 
            background: #fff; 
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #f0f0f0;
            margin-top: 10px;
        }

        .media-destaque { 
            width: 100%; 
            background: #f5f5f5; 
            overflow: hidden; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            aspect-ratio: 1 / 1; 
        }
        .media-destaque img { width: 100%; height: 100%; display: block; object-fit: cover; }
        .media-destaque video { width: 100%; height: 100%; display: block; background: #000; object-fit: cover; }

        .info-destaque { padding: 15px; position: relative; }
        .titulo-c { font-size: 18px; font-weight: 800; color: #333; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .expositor-nome { margin: 0; font-size: 13px; font-weight: 700; color: #9c27b0; text-transform: uppercase; letter-spacing: 1px; }
        .msg-destaque { margin: 10px 0 0; font-size: 15px; font-weight: 500; color: #666; padding-right: 50px; line-height: 1.4; }
        
        .like-container { position: absolute; right: 15px; top: 15px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .like-btn { font-size: 1.5rem; color: #ccc; transition: transform 0.2s; }
        .like-btn.active { color: #e91e63; transform: scale(1.2); }
        .like-count { font-size: 0.8rem; color: #888; font-weight: bold; }
    </style>
</head>
<body>

    <div class="mural-titulo">Destaques do Mês</div>
    <div class="barra-divisora"></div>

    <div class="swiper mySwiper">
        <div class="swiper-wrapper" id="container-destaques"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <script>
        async function carregarDestaques() {
            // Seu novo link do Script do Espaço de Compras
            const urlDestaques = "https://script.google.com/macros/s/AKfycbx0t7BihiSwEBiyKasFm6NRrz0O1teqgILDFrLdp-V0iHXkwFdgn5kDZ_KzGKGfEWFb/exec"; 
            
            try {
                const res = await fetch(urlDestaques);
                const dados = await res.json();
                const agora = new Date().getTime();
                
                // REGRA DE 30 DIAS
                const tempoExposicao = 30 * 24 * 60 * 60 * 1000;

                const html = dados.reverse().filter(item => {
                    if(!item.data) return false;
                    return (agora - new Date(item.data).getTime()) <= tempoExposicao;
                }).map(item => {
                    const arquivo = (item.arquivo || "").trim();
                    const ehVideo = /\.(mp4|webm|mov|ogg)$/i.test(arquivo) || (item.formato && item.formato.toLowerCase() === "video");
